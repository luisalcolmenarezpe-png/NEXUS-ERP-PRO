<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <title>Nexus ERP Pro</title>
    <meta name="description" content="ERP/POS ligero con login, inventario, clientes y sincronización" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- PANTALLA DE ACCESO UNIFICADA -->
    <div id="pantalla-login" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: #1e293b; padding: 30px; border-radius: 10px; width: 320px; text-align: center;">
            <h2 style="color: #38bdf8; margin-bottom: 15px;">Nexus ERP Pro</h2>
            <input type="text" id="u-login" placeholder="Usuario (admin / cajero)" style="width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px;"><br>
            <input type="password" id="p-login" placeholder="Contraseña (1234)" style="width: 100%; padding: 10px; margin-bottom: 20px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px;"><br>
            <button id="btn-entrar-sistema" style="width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; border-radius: 5px;">Entrar</button>
            <p id="error-login" style="color: #f87171; font-size: 13px; display: none; margin-top: 10px;">Usuario o contraseña incorrectos</p>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL ERP (Oculto hasta hacer login) -->
    <div id="sistema-contenido" style="display: none;">
      <div class="app-shell" style="display:flex; width: 100vw; height: 100vh;">
        <aside class="sidebar" style="width: 260px; background: #1e293b; color: white; padding: 20px;">
          <div class="brand" style="margin-bottom: 30px;">
            <div class="brand-mark">N</div>
            <div>
              <h1 style="font-size: 18px; margin: 0;">Nexus ERP</h1>
              <small style="color: #94a3b8;">POS & ERP</small>
            </div>
          </div>
          <nav id="nav" class="nav">
            <ul style="list-style: none; padding: 0;">
              <li id="menu-inicio" style="padding: 10px 0;"><a href="#" style="color: #38bdf8; text-decoration: none;">Dashboard</a></li>
              <li id="menu-caja" style="padding: 10px 0;"><a href="#" style="color: white; text-decoration: none;">Caja / POS</a></li>
              <li id="menu-inventario" style="padding: 10px 0;"><a href="#" style="color: white; text-decoration: none;">Inventario</a></li>
              <li id="menu-finanzas" style="padding: 10px 0;"><a href="#" style="color: white; text-decoration: none;">Finanzas</a></li>
              <li id="menu-clientes" style="padding: 10px 0;"><a href="#" style="color: white; text-decoration: none;">Clientes</a></li>
            </ul>
          </nav>
        </aside>

        <main class="content" style="flex: 1; background: #0f172a; color: white; padding: 20px;">
          <header class="topbar" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px;">
            <div>
              <p class="eyebrow" style="color: #38bdf8; margin: 0; font-size: 12px;">Panel principal</p>
              <h2 id="pageTitle" style="margin: 0;">Dashboard</h2>
            </div>
            <div class="status-row">
              <button id="btnSync" class="secondary-btn" style="padding: 8px 12px; background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer;">Sincronizar</button>
              <button id="btnExportCsv" class="secondary-btn" style="padding: 8px 12px; background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer;">Exportar CSV</button>
              <button id="btnLogout" class="danger-btn" style="padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="location.reload();">Cerrar sesión</button>
            </div>
          </header>

          <section id="app" class="app-view">
            <p>¡Bienvenido al sistema Nexus ERP Pro operativo!</p>
          </section>
        </main>
      </div>
    </div>

    <script src="auth_v2.js"></script>
  </body>
</html>
