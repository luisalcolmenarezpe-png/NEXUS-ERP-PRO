<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nexus ERP Pro</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="description" content="Nexus ERP Pro - Electron app" />
  <link rel="manifest" href="manifest.json" />
  <style>
    /* Estilos mínimos para el prototipo */
    body { font-family: system-ui, Arial, sans-serif; margin:0; padding:0; background:#f5f7fb; }
    header { background:#0b5fff; color:#fff; padding:12px 20px; }
    main { padding:20px; }
    .container { max-width:1100px; margin:0 auto; }
    .card { background:#fff; border-radius:6px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    input, button { padding:8px 10px; font-size:14px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1 style="margin:0">Nexus ERP Pro</h1>
    </div>
  </header>

  <main>
    <div class="container" id="app">
      <div id="loading" class="card">Cargando aplicación...</div>
    </div>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
