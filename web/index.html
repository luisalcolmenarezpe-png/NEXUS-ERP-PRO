<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="no-referrer" />
    <title>Nexus ERP Pro</title>
    <meta name="description" content="ERP/POS ligero con login, inventario, clientes y sincronización" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <h2>Nexus ERP Pro</h2>
        <form id="authForm" class="auth-form">
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" type="email" placeholder="usuario@empresa.com" required />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" required />
          </div>
          <div class="auth-actions">
            <button type="submit" class="primary-btn">Iniciar sesión</button>
            <button type="button" id="btnCreateAccount" class="secondary-btn">Crear cuenta</button>
          </div>
          <div id="authError" class="error-message"></div>
        </form>
      </div>
    </div>

    <div id="appShell" class="app-shell" style="display:none">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">N</div>
          <div>
            <h1>Nexus ERP</h1>
            <small>POS & ERP</small>
          </div>
        </div>

        <nav id="nav" class="nav"></nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Panel principal</p>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
          <div class="status-row">
            <button id="btnSync" class="secondary-btn">Sincronizar</button>
            <button id="btnExportCsv" class="secondary-btn">Exportar CSV</button>
            <button id="btnLogout" class="danger-btn">Cerrar sesión</button>
          </div>
        </header>

        <section id="app" class="app-view"></section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
