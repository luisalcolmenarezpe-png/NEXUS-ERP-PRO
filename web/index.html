<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus ERP Pro - Sistema Fiscal POS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body style="background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 0;">

    <!-- PANTALLA DE ACCESO -->
    <div id="pantalla-login" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: #1e293b; padding: 30px; border-radius: 10px; width: 340px; text-align: center; border: 1px solid #334155;">
            <h2 style="color: #38bdf8; margin-bottom: 5px;">Nexus ERP Pro</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 20px;">Control Fiscal y POS</p>
            
            <input type="text" id="u-login" placeholder="Código de Usuario / Cédula (admin / cajero)" style="width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px; box-sizing: border-box;"><br>
            <input type="password" id="p-login" placeholder="Clave de Acceso (1234)" style="width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px; box-sizing: border-box;"><br>
            
            <select id="modo-selector" style="width: 100%; padding: 10px; margin-bottom: 20px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 4px;">
                <option value="pos">Modo Fiscal / Ventas (POS)</option>
                <option value="reporte">Modo Reporte (Fiscal X/Z)</option>
                <option value="set">Modo Set (Administrativo)</option>
            </select><br>

            <button id="btn-entrar-sistema" style="width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; border-radius: 5px;">Entrar al Sistema</button>
            <p id="error-login" style="color: #f87171; font-size: 13px; display: none; margin-top: 10px;">Credenciales incorrectas</p>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DEL ERP -->
    <div id="sistema-contenido" style="display: none; width: 100vw; height: 100vh;">
      <div class="app-shell" style="display: flex; width: 100%; height: 100%;">
        
        <!-- BARRA LATERAL (El menú se inyecta aquí automáticamente) -->
        <aside class="sidebar" style="width: 260px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; display: flex; flex-direction: column;">
          <div class="brand" style="margin-bottom: 30px;">
            <h1 style="font-size: 18px; margin: 0; color: #38bdf8;">Nexus ERP</h1>
            <small style="color: #94a3b8;">POS & ERP Fiscal</small>
          </div>
          
          <nav id="nav" class="nav" style="flex: 1;"></nav>

          <div>
            <button id="btnLogout" class="danger-btn" style="width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Cerrar Sesión</button>
          </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content" style="flex: 1; display: flex; flex-direction: column; background: #0f172a; overflow-y: auto;">
          <header class="topbar" style="display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-bottom: 1px solid #334155;">
            <div>
              <p class="eyebrow" style="color: #38bdf8; margin: 0; font-size: 12px;">Panel principal</p>
              <h2 id="pageTitle" style="margin: 0; font-size: 18px;">Dashboard</h2>
            </div>
            <div class="status-row" style="display: flex; align-items: center; gap: 15px;">
              <span style="font-size: 11px; color: #4ade80;">Impresora Fiscal: Conectada 🟢</span>
              <span id="reloj-sistema" style="font-size: 13px; background: #0f172a; padding: 6px 12px; border-radius: 4px; border: 1px solid #334155;">--:--:--</span>
            </div>
          </header>

          <!-- Las vistas (POS, Inventario, Reportes, etc.) se inyectan aquí -->
          <section id="app" class="app-view" style="padding: 25px; flex: 1;"></section>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
