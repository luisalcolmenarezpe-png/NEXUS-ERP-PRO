<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0b0f15]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus ERP Pro - Enterprise Fiscal Core</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hrbg: '#0b0f15',
              hrcard: '#161b26',
              hrborder: '#212a3b',
              hractive: '#2dd4bf',
            }
          }
        }
      }
    </script>
  </head>
  <body class="h-full text-slate-100 font-sans antialiased overflow-hidden bg-hrbg">

    <!-- MÓDULO DE LOGIN (Corregido con h-full w-full) -->
    <div id="login-container" class="h-full w-full absolute inset-0 z-50"></div>

    <!-- CONTENEDOR PRINCIPAL DEL ERP (Oculto hasta hacer login) -->
    <div id="sistema-contenido" class="hidden h-full w-full flex bg-hrbg">
      
      <!-- BARRA LATERAL (SIDEBAR) -->
      <aside class="w-64 bg-hrcard border-r border-hrborder flex flex-col justify-between p-5 select-none shadow-2xl">
        <div>
          <div class="flex items-center gap-3 mb-6 px-2">
            <div class="w-10 h-10 rounded-xl bg-[#2dd4bf] flex items-center justify-center font-bold text-slate-950 text-lg shadow-[0_0_20px_rgba(45,212,191,0.35)]">
              N
            </div>
            <div>
              <h1 class="font-bold text-white text-base tracking-wide">Nexus ERP Pro</h1>
              <span class="text-[10px] font-semibold text-[#2dd4bf] uppercase tracking-widest">Fiscal & POS Core</span>
            </div>
          </div>

          <div class="mb-6 px-1">
            <div class="relative">
              <input type="text" placeholder="Search modules..." class="w-full bg-[#0b0f15] border border-hrborder rounded-xl px-3 py-2 text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-[#2dd4bf] transition-all">
              <span class="absolute right-3 top-2 text-[10px] text-slate-500 bg-hrborder px-1.5 py-0.5 rounded">⌘K</span>
            </div>
          </div>
          
          <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 px-3">Main Menu</div>
          <nav id="nav" class="space-y-1.5"></nav>
        </div>

        <div class="pt-4 border-t border-hrborder">
          <button id="btnLogout" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl font-semibold text-xs transition-all cursor-pointer">
            Cerrar Sesión
          </button>
        </div>
      </aside>

      <!-- ÁREA DE TRABAJO PRINCIPAL -->
      <main class="flex-1 flex flex-col h-full overflow-hidden bg-hrbg">
        
        <header class="h-16 bg-hrcard/60 backdrop-blur-md border-b border-hrborder flex items-center justify-between px-8 z-10">
          <div>
            <p class="text-[10px] uppercase tracking-widest text-[#2dd4bf] font-bold">Terminal Activo</p>
            <h2 id="pageTitle" class="text-base font-bold text-white tracking-tight">Cargando módulo...</h2>
          </div>
          
          <div class="flex items-center gap-4">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-[#2dd4bf]/10 border border-[#2dd4bf]/20 rounded-full text-[#2dd4bf] text-xs font-semibold">
              <span class="w-2 h-2 rounded-full bg-[#2dd4bf] animate-pulse"></span>
              Impresora Fiscal: Conectada
            </div>
            <div id="reloj-sistema" class="px-3 py-1.5 bg-[#0b0f15] border border-hrborder rounded-xl text-slate-300 font-mono text-xs">
              --:--:--
            </div>
          </div>
        </header>

        <section id="app" class="flex-1 overflow-y-auto p-8 bg-hrbg space-y-6">
          <!-- Contenido modular -->
        </section>
      </main>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
