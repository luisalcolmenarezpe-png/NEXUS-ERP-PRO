name: Build and Sign Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - luisalcolmenarezpe-png-web-erp-app

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build_sign:
    name: Build and Sign (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Decode certificate (from CERT_BASE64)
        if: ${{ secrets.CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          Write-Host "Decoding certificate to certificate.p12"
          $bytes = [System.Convert]::FromBase64String("${{ secrets.CERT_BASE64 }}")
          [System.IO.File]::WriteAllBytes("certificate.p12", $bytes)

      - name: Build and sign installer
        env:
          CSC_LINK: certificate.p12
          CSC_KEY_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: npm run dist:win:secure

      - name: Upload built installer
        uses: actions/upload-artifact@v4
        with:
          name: nexus-installer
          path: dist/*.exe

      - name: Create GitHub Release and attach installer
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          files: dist/*.exe
