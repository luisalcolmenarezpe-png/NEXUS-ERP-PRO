name: Snyk Scan

on:
  push:
    branches: [ main, luisalcolmenarezpe-png-web-erp-app ]
  pull_request:

jobs:
  snyk:
    name: Run Snyk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Snyk test
        uses: snyk/actions/node@master
        with:
          args: test --dev
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Monitor to Snyk
        uses: snyk/actions/node@master
        with:
          args: monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
