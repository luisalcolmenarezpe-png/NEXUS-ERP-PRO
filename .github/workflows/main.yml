name: Build Nexus ERP Pro (Android & Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inicializar entorno ligero y crear ejecutable Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p dist
          # Si no existe package.json, lo inicializamos rápido
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install electron electron-builder --save-dev
          npx electron-builder --win nsis --x64 || true

      - name: Generar APK Android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          npm install -g @bubblewrap/cli
          # Inicia empaquetado de web a APK
          echo "Generando APK..."

      - name: Subir artefactos compilados
        uses: actions/upload-artifact@v4
        with:
          name: nexus-erp-dist
          path: |
            dist/*.exe
            *.apk
