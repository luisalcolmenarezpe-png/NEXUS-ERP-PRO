name: Build Nexus ERP Pro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Obtener dependencias
        run: flutter pub get

      - name: Generar archivos de plataforma Android
        run: flutter create . --platforms=android

      - name: Compilar APK Android Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_KEY=$SUPABASE_KEY

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: nexus-erp-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
