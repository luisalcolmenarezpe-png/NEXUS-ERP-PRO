name: Build Nexus ERP Pro (Android & Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del proyecto
        run: npm install

      # 1. COMPILACIÓN PARA WINDOWS (.exe)
      - name: Compilar ejecutable para Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          npx electron-builder --win nsis --x64
        continue-on-error: true

      # 2. COMPILACIÓN PARA ANDROID (.apk)
      - name: Compilar APK Android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          npx @bubblewrap/cli build
        continue-on-error: true

      # 3. SUBIR LOS ARCHIVOS COMPILADOS COMO ARTEFACTOS
      - name: Subir ejecutable de Windows y APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-erp-dist
          path: |
            dist/*.exe
            *.apk
